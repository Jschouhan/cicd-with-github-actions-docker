version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-yourdockerhubuser}/cicd-demo:latest
    container_name: cicd-demo-app
    ports:
      - "5000:5000"
    environment:
      - APP_VERSION=1.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
